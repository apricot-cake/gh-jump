name: Microsoft Store

on:
  workflow_dispatch:
    inputs:
      mode:
        description: verifyは接続確認、submitはパッケージ提出、listing-verifyは掲載内容の確認、listing-submitは掲載更新の提出
        type: choice
        required: true
        default: verify
        options:
          - verify
          - submit
          - listing-verify
          - listing-submit
      listing_file:
        description: 掲載更新に使用する言語別データ
        type: choice
        required: true
        default: store/listings.json
        options:
          - store/listings.json
          - store/listings.ja-jp.json

permissions:
  contents: read

concurrency:
  group: microsoft-store
  cancel-in-progress: false

jobs:
  package:
    name: ビルド・テスト・解析・パッケージ検証
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: ビルド・テスト・整形・Analyzer
        shell: pwsh
        run: ./scripts/Verify.ps1 -Configuration Release -Architecture x64
      - name: Store掲載データと更新処理の検証
        shell: pwsh
        run: ./scripts/Test-StoreListing.ps1
      - name: x64・ARM64 bundleの検証
        shell: pwsh
        run: ./scripts/Package-Bundle.ps1 -Configuration Release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microsoft-store-package
          path: artifacts/packages/*_Bundle.msixbundle
          if-no-files-found: error
          retention-days: 7

  store:
    name: 承認後のStore API操作
    needs: package
    if: github.ref == 'refs/heads/main'
    environment: microsoft-store
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: microsoft-store-package
          path: artifacts/packages
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3
      - name: OIDC認証とStore API操作
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
          MSSTORE_SELLER_ID: ${{ vars.MSSTORE_SELLER_ID }}
          STORE_MODE: ${{ inputs.mode }}
          STORE_LISTING_PATH: ${{ inputs.listing_file }}
        run: ./scripts/Submit-Store.ps1 -Mode $env:STORE_MODE -ListingPath $env:STORE_LISTING_PATH
